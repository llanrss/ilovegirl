<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Você me ama?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff0f6; --bg2: #fbd3e6; --bg3: #f8c4de;
    --card: #fff; --text: #1a1a1a; --muted: #555; --accent: #e0244f;
    --no-bg: #e9e9ec; --no-text: #333; --shadow: rgba(190, 80, 130, .25);
    --art-bg: #f7b6bd; --ring: rgba(240, 33, 90, .12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #2a1320; --bg2: #3a1a2b; --bg3: #2a1320;
      --card: #34202c; --text: #fbeaf1; --muted: #d9b9c8; --accent: #ff6b8e;
      --no-bg: #4a3641; --no-text: #f1e3ea; --shadow: rgba(0, 0, 0, .45);
      --art-bg: #5a2a3d; --ring: rgba(255, 107, 142, .2);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #2a1320; --bg2: #3a1a2b; --bg3: #2a1320;
    --card: #34202c; --text: #fbeaf1; --muted: #d9b9c8; --accent: #ff6b8e;
    --no-bg: #4a3641; --no-text: #f1e3ea; --shadow: rgba(0, 0, 0, .45);
    --art-bg: #5a2a3d; --ring: rgba(255, 107, 142, .2);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg1), var(--bg2) 60%, var(--bg3));
    color: var(--text);
  }
  .card {
    position: relative; width: min(320px, 90vw);
    padding: 26px 24px 16px; text-align: center;
    background: var(--card); border-radius: 16px;
    box-shadow: 0 10px 30px var(--shadow);
  }
  h1 { font-size: 1.15rem; font-weight: 900; color: var(--text); margin-bottom: 18px; }
  .btns { position: relative; height: 84px; display: flex; justify-content: center; align-items: center; gap: 30px; }
  button {
    font-family: inherit; font-weight: 900; border: 0; cursor: pointer; border-radius: 999px;
  }
  #yes {
    padding: 9px 20px; font-size: .85rem; color: #fff;
    background: linear-gradient(135deg, #ff4d7d, #f0215a);
    box-shadow: 0 6px 14px rgba(240, 33, 90, .4);
    transform: scale(var(--s, 1)); z-index: 2;
    transition: transform .35s cubic-bezier(.3, 1.4, .5, 1);
  }
  #no {
    padding: 7px 14px; font-size: .7rem; color: var(--no-text); background: var(--no-bg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
    transform: translate(var(--dx, 0px), var(--dy, 0px)); z-index: 3;
    transition: transform .45s cubic-bezier(.3, 1.3, .5, 1);
  }
  .hint { font-size: .6rem; color: var(--muted); margin-top: 8px; min-height: 1em; }

  .win h1 { color: var(--accent); margin-bottom: 8px; }
  .win p { font-size: .7rem; color: var(--muted); margin-bottom: 12px; }
  .win svg.art { width: 130px; height: 120px; border-radius: 8px; background: var(--art-bg); }

  /* ===== Gato + anel animado ===== */
  .cat-wrap { position: relative; width: 96px; height: 84px; margin: 0 auto 4px; }
  .cat { position: relative; z-index: 1; width: 96px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .15)); }
  .coil {
    position: absolute; left: 50%; top: 50%;
    margin: -4em 0 0 -4em; width: 8em; height: 8em;
    animation: spin 6s linear infinite;
  }
  .coil circle { fill: none; stroke-width: 10; stroke-linecap: round; }
  .coil-track { stroke: var(--ring); }
  .coil-glow { stroke: #ff4d7d; stroke-dasharray: 60 192; opacity: .75; }
  .win .cat-wrap { animation: bounce .8s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bounce { to { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .coil, .win .cat-wrap { animation: none; } }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="card" id="card">
  <div class="cat-wrap">
    <svg class="coil" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="coil-track" cx="50" cy="50" r="40"/>
      <circle class="coil-glow" cx="50" cy="50" r="40"/>
    </svg>
    <svg class="cat" viewBox="0 0 120 100" role="img" aria-label="Gatinho laranja">
      <polygon points="22,40 26,10 54,28" fill="#f2924a"/>
      <polygon points="98,40 94,10 66,28" fill="#f2924a"/>
      <polygon points="28,34 30,18 44,28" fill="#f7b2a0"/>
      <polygon points="92,34 90,18 76,28" fill="#f7b2a0"/>
      <ellipse cx="60" cy="60" rx="42" ry="34" fill="#f9ad63"/>
      <circle cx="45" cy="56" r="3" fill="#3a2a2a"/>
      <circle cx="75" cy="56" r="3" fill="#3a2a2a"/>
      <ellipse cx="60" cy="67" rx="4" ry="3" fill="#f06b8a"/>
      <ellipse cx="36" cy="68" rx="6" ry="4" fill="#f7a08a" opacity=".6"/>
      <ellipse cx="84" cy="68" rx="6" ry="4" fill="#f7a08a" opacity=".6"/>
      <path transform="translate(100 24)" d="M0,-5 C-9,-14 -20,-2 0,12 C20,-2 9,-14 0,-5Z" fill="#f0215a"/>
    </svg>
  </div>

  <h1 id="title">Você me ama? ❤️</h1>

  <div class="btns" id="btns">
    <button id="yes">Sim! 💖</button>
    <button id="no">Não 😒</button>
  </div>
  <p class="hint" id="hint">"Não" parece estar com vergonha 😏</p>
</div>

<script>
  const card = document.getElementById('card');
  const btns = document.getElementById('btns');
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const hint = document.getElementById('hint');

  const messages = [
    'Botão errado! 🤨', 'Tem certeza? 😢', 'Olha como o SIM está crescendo! 😏',
    'Clica logo no Sim 🥺', 'O botão Não está quebrado 🙃', 'Boa tentativa 😎',
    'Você sabe que quer 💕'
  ];
  const catHTML = card.querySelector('.cat-wrap').outerHTML; // reaproveitado na tela final
  let tries = 0;

  function runAway() {
    tries++;
    const s = Math.min(1 + tries * 0.3, 3.4);
    yes.style.setProperty('--s', s);
    hint.textContent = messages[(tries - 1) % messages.length];

    // posições-base (sem transform), para não errar durante a animação
    const c = card.getBoundingClientRect();
    const b = btns.getBoundingClientRect();
    const baseL = b.left + no.offsetLeft, baseT = b.top + no.offsetTop;
    const w = no.offsetWidth, h = no.offsetHeight;
    const cx = b.left + yes.offsetLeft + yes.offsetWidth / 2;
    const cy = b.top + yes.offsetTop + yes.offsetHeight / 2;
    const hw = yes.offsetWidth * s / 2 + 12, hh = yes.offsetHeight * s / 2 + 12;

    let nl = baseL, nt = baseT;
    for (let i = 0; i < 40; i++) {
      nl = c.left + 8 + Math.random() * (c.width - w - 16);
      nt = c.top + 8 + Math.random() * (c.height - h - 16);
      const ox = nl + w / 2, oy = nt + h / 2;
      const overlap = Math.abs(ox - cx) < hw + w / 2 && Math.abs(oy - cy) < hh + h / 2;
      if (!overlap) break;
    }
    no.style.setProperty('--dx', (nl - baseL) + 'px');
    no.style.setProperty('--dy', (nt - baseT) + 'px');
  }

  no.addEventListener('pointerenter', runAway);
  no.addEventListener('pointerdown', e => { e.preventDefault(); runAway(); });

  yes.addEventListener('click', () => {
    card.classList.add('win');
    card.innerHTML = catHTML + `
      <h1>EBA! Eu também te amo! 🎉❤️</h1>
      <p>Você fez meu coração disparar! 💓</p>
      <svg class="art" viewBox="0 0 130 120" role="img" aria-label="Coração: eu te amo">
        <path d="M65,108 C10,70 12,22 40,18 C54,16 62,26 65,34 C68,26 76,16 90,18 C118,22 120,70 65,108Z"
              fill="#e0244f" stroke="#7a0f2a" stroke-width="3"/>
        <path d="M65,96 C24,66 26,32 44,30 C56,29 62,38 65,44 C68,38 74,29 86,30 C104,32 106,66 65,96Z"
              fill="#ff6b8e"/>
        <text x="65" y="64" text-anchor="middle" font-family="Nunito, sans-serif"
              font-weight="900" font-size="14" fill="#fff" stroke="#7a0f2a" stroke-width="1">EU</text>
        <text x="65" y="86" text-anchor="middle" font-family="Nunito, sans-serif"
              font-weight="900" font-size="17" fill="#fff" stroke="#7a0f2a" stroke-width="1">TE AMO!</text>
      </svg>`;
    confetti();
  });

  function confetti() {
    const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#ff4d7d', '#f0215a', '#ffb3c8', '#ffd166', '#a0a0a0', '#ffffff'];
    const ps = Array.from({ length: 220 }, () => ({
      x: Math.random() * cv.width, y: -Math.random() * cv.height,
      r: 1.5 + Math.random() * 2.5, vy: 1 + Math.random() * 3,
      vx: (Math.random() - .5) * 1.2, c: colors[(Math.random() * colors.length) | 0]
    }));
    const end = performance.now() + 7000;
    (function frame(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.y > cv.height) { p.y = -5; p.x = Math.random() * cv.width; }
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      });
      if (t < end) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
    })(performance.now());
  }
</script>
</body>
</html>
